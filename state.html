<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- Legacy URL. Every jurisdiction now has a pre-rendered page at state/<abbr>.html.
       This shell only ever held ~23 words of HTML and every ?state=XX variant was
       byte-identical to a crawler, so it must not be indexed: noindex here, and the
       47 old URLs are out of the sitemap. It stays alive purely to forward old
       inbound links and bookmarks. -->
  <meta name="robots" content="noindex, follow" />
  <title>State Lottery — NumbersIntel</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Forward before anything renders, preserving the requested state.
    (function () {
      var m = /[?&]state=([A-Za-z]{2})/.exec(location.search);
      var target = m ? "state/" + m[1].toLowerCase() + ".html" : "states.html";
      location.replace(target);
    })();
  </script>
</head>
<body>
  <main class="prose" style="max-width:640px;margin:4rem auto;padding:0 1.25rem">
    <h1>Taking you to the state page&hellip;</h1>
    <p>State lottery pages have moved. If you are not redirected automatically,
      <a href="states.html">choose your state here</a>.</p>
  </main>
</body>
</html>
